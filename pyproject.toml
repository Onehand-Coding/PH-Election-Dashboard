[project]
name = "ph-election-dashboard"
version = "0.2.0"
description = "A dashboard for Philippine election sample data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Onehand Coding", email = "onehand.coding433@gmail.com" },
]
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.40",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_election_dashboard"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
ph-election-dashboard = "ph_election_dashboard.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
