[project]
name = "PH-election-dashboard"
version = "0.1.0"
description = "A Dashboard for Philippine Election Data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Onehand Coding", email = "onehand.coding433@gmail.com" },
]
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.20",
    "plotly>=5.0",
    "google-generativeai>=0.5",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_election_dashboard"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py38"

[project.scripts]
ph-election-dashboard = "ph_election_dashboard.launcher:main"
